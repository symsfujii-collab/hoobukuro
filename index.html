<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ほおぶくろ</title>
<meta name="description" content="やりたいことをためて、かなえて、ハムスターを育てるアプリ">
<meta name="theme-color" content="#EDF2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="view"></main>

<section id="mapView" hidden aria-label="地図">
  <div id="map"></div>
  <div class="map-tools">
    <span class="map-chip" id="mapCount"></span>
    <label class="map-chip map-toggle"><input type="checkbox" id="showDone"> 達成済みも</label>
    <button class="icon-btn map-locate" data-act="mapLocate" aria-label="現在地へ" data-ic="locate"></button>
  </div>
  <p class="map-hint">地図を長押しすると、その場所で追加できるよ</p>
</section>

<div id="walkBar" role="status" hidden></div>

<nav class="tabbar" aria-label="メニュー">
  <button class="tab" data-act="tab" data-tab="home" data-ic="home"><span>ホーム</span></button>
  <button class="tab" data-act="tab" data-tab="list" data-ic="list"><span>リスト</span></button>
  <button class="tab add" data-act="add" aria-label="やりたいを追加" data-ic="plus"></button>
  <button class="tab" data-act="tab" data-tab="map" data-ic="map"><span>地図</span></button>
  <button class="tab" data-act="tab" data-tab="done" data-ic="book"><span>思い出</span></button>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
